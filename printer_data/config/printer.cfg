# This file contains common pin mappings for the BIGTREETECH SKR
# MINI 2.0. To use this config, the firmware should be compiled for 
# the STM32F103 with a "28KiB bootloader". Also select "enable extra 
# low-level configuration options" and configure "GPIO pins to set 
# at micro-controller startup" to "!PA14".

# The "make flash" command does not work on the SKR mini. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini with that SD card.

# See the example.cfg file for a description of available parameters.

[include kiauh_macros.cfg]
[include macros_homing.cfg]
[include macros_startstop.cfg]
[include macros_heatsoak.cfg]
[include macros_loadunload.cfg]
[include macros_leveling.cfg]
[include macros_leds.cfg]

[include bme280.cfg]
[include neopixel.cfg]
[include filament_sensor.cfg]
[include accel.cfg]

[include v0_display.cfg]

[include dock.cfg]

[pause_resume]

[display_status]

[virtual_sdcard]
path: ~/gcode_files

# Use RPi as an MCU
[mcu host]
serial: /tmp/klipper_host_mcu

[temperature_sensor host]
sensor_type: temperature_host

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_31FFD6054250373912850157-if00

[stepper_x]
step_pin: PB13
dir_pin: PB12	# Remove the ! if stepper is moving the opposite direction
enable_pin: !PB14
rotation_distance: 40
microsteps: 16
endstop_pin: PC0 
position_endstop: 120
position_max: 120
homing_speed: 20   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
interpolate: True
run_current: .25
hold_current: .25
sense_resistor: 0.110
stealthchop_threshold: 500

[stepper_y]
step_pin: PB10
dir_pin: PB2	# Remove the ! if stepper is moving the opposite direction
enable_pin: !PB11
rotation_distance: 40
microsteps: 16
endstop_pin: PC1
position_endstop: 120
position_max: 120
homing_speed: 20   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
interpolate: True
run_current: .25
hold_current: .25
sense_resistor: 0.110
stealthchop_threshold: 500

[stepper_z]
step_pin: PB0
dir_pin: !PC5	# Remove the ! if stepper is moving the opposite direction
enable_pin: !PB1
rotation_distance: 8 #for T8x8 lead screw
microsteps: 16
#PROBEDEBUG switch to z_virtual_endstop
#endstop_pin: probe:z_virtual_endstop 
endstop_pin: PC2
#position_endstop = 0.445
position_max: 120
position_min: -1
homing_speed: 10   #Max 100
second_homing_speed: 3.0
homing_retract_dist: 3.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
interpolate: True
run_current: .25
hold_current: 0.25
sense_resistor: 0.110
stealthchop_threshold: 500

[extruder]
step_pin: PB3
dir_pin: !PB4	# Remove the ! if stepper is moving the opposite direction
enable_pin: !PD2
# 2021-05-07 eSun ABS+ Green: 21.854269
# 2021-09-10 KVP ABS Black: 20.552104
rotation_distance: 20.552104
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: PT1000
sensor_pin: PA0
# based on calibration procedure at https://github.com/KevinOConnor/klipper/issues/2194#issuecomment-557562153
pullup_resistor: 4620
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 270
min_extrude_temp: 170
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
max_extrude_cross_section: .8
Pressure_advance: 0.0
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
interpolate: True
run_current: 0.3
hold_current: 0.3
sense_resistor: 0.110
stealthchop_threshold: 500

[heater_bed]
heater_pin: PC9
sensor_type: NTC 100K beta 3950
sensor_pin: PC3
smooth_time: 3.0
max_power: 1.0
#control: pid
min_temp: 0
max_temp: 120
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

[printer]
kinematics: corexy
max_velocity: 300

# for measuring resonance
#max_accel: 10000
#max_accel_to_decel: 10000

max_accel: 4000
max_z_velocity: 10
max_z_accel: 30
square_corner_velocity: 5.0

[heater_fan hotend_fan]
pin: PC7
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
#If you are experiencing back flow, you can reduce fan_speed
fan_speed: 1.0

[fan]
pin: PC6
kick_start_time: 0.5
#depending on your fan, you may need to increase or reduce this value
#if your fan will not start
off_below: 0.30
cycle_time: 0.010

[idle_timeout]
timeout: 1800

[homing_override]
axes: z
set_position_z: 0
gcode:
	G90
	G0 Z5 F600
	G28 X Y
	# 15,0 is safe to home when the probe is attached
	G0 X15 Y0 F3600 
	
	#PROBEDEBUG put probe on center for virtual z endstop. If no virtual endstop, uncomment above
	#G0 X53 Y68.5 F3600   

	G28 Z
	G0 Z10 F1800
	G0 X60 Y60 Z20 F3600

# Tool to help adjust bed leveling screws. One may define a
# [bed_screws] config section to enable a BED_SCREWS_ADJUST g-code
# command.
[bed_screws]
screw1: 60,5
screw1_name: front
screw2: 5,115
screw2_name: back left
screw3: 115,115
screw3_name: back right

[endstop_phase]

#[probe]
#pin: ^PC13
#x_offset: 1.5
#y_offset: -14
#z_offset: 2.060
#samples: 1

[screws_tilt_adjust]
screw1: 58.5,19
screw1_name: front
screw2: 3.5,120 # actually 129
screw2_name: back_left
screw3: 113.5, 120 # actually 129
screw3_name: back right
screw_thread: CW-M3

[bed_mesh]
mesh_min: 5,5
mesh_max: 104,104
probe_count: 3,3
#algorithm: bicubic
fade_start: 1.0
fade_end: 10.0
relative_reference_index: 5

