[fan_generic recirc_fan]
pin: PC12
max_power: 1.0
kick_start_time: 0.25

[delayed_gcode RECIRC_STOP_DELAYED]
gcode:
    SET_FAN_SPEED FAN=recirc_fan SPEED=0.0

[gcode_macro RECIRC_PRINT_START]
gcode:
	SET_FAN_SPEED FAN=recirc_fan SPEED=0.01

[gcode_macro RECIRC_PRINT_END]
gcode:
	SET_FAN_SPEED FAN=recirc_fan SPEED=1.0
	UPDATE_DELAYED_GCODE ID=RECIRC_STOP_DELAYED DURATION=180
	
